name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-base.txt
          pip install -r requirements/requirements-rag.txt

      - name: Syntax check
        run: python -m compileall -q src scripts .github/ci_smoke.py

      - name: Core modules import
        run: >
          python -c
          "import src.config, src.data.layout, src.rag.chunker, src.rag.bm25,
          src.rag.retriever, src.rag.embedder, src.rag.reranker, src.rag.self_rag,
          src.rag.store, src.rag.factory, src.serving.guided_decode,
          src.eval.faithfulness, src.eval.citation"

      - name: RAG smoke test
        run: python .github/ci_smoke.py
