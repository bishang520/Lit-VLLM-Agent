# SFT 冒烟配置：小模型快速验证 GPU 训练链路（正式训练用 sft_qlora.yaml）
model:
  base: Qwen/Qwen2.5-0.5B-Instruct
  tokenizer: Qwen/Qwen2.5-0.5B-Instruct
  extended_tokenizer_dir: work/models/extended_tokenizer_smoke
  attn_implementation: null

data:
  train_file: work/data/sft_train.jsonl
  eval_file: work/data/sft_eval.jsonl
  max_length: 2048

qlora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bits: 4
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

training:
  output_dir: work/models/sft-smoke-qwen05b
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 20
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  eval_strategy: steps
  save_total_limit: 2
  gradient_checkpointing: true
  fp16: false
  bf16: true
  deepspeed: null
  report_to: none
  max_steps: 100

merge:
  save_merged: true
  merged_dir: work/models/sft-smoke-qwen05b-merged
