# Qwen2.5-7B 正式 SFT（单卡 4090 24G 优化版）
# 说明：单卡训练无需 DeepSpeed（ZeRO-2 配置保留在 sft_qlora.yaml，多卡时使用）
model:
  base: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  # 复用 0.5B 冒烟阶段生成的扩展词表（Qwen2.5 全系同一词表，新增 token 通用）
  extended_tokenizer_dir: work/models/extended_tokenizer_smoke
  attn_implementation: null

data:
  train_file: work/data/sft_train.jsonl
  eval_file: work/data/sft_eval.jsonl
  max_length: 2048

qlora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bits: 4
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

training:
  output_dir: work/models/sft-qwen7b
  num_train_epochs: 3
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 20
  logging_steps: 5
  save_steps: 100
  eval_steps: 100
  eval_strategy: steps
  save_total_limit: 2
  gradient_checkpointing: true
  fp16: false
  bf16: true
  deepspeed: null
  report_to: none
  max_steps: 400

merge:
  save_merged: true
  merged_dir: work/models/sft-qwen7b-merged
