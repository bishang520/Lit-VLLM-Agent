# QLoRA SFT 训练配置（GPU 服务器）
model:
  base: Qwen/Qwen2.5-7B-Instruct
  tokenizer: Qwen/Qwen2.5-7B-Instruct
  # 若已执行 expand_vocab.py，填写扩展词表目录以启用领域词表（自动 resize embedding）
  extended_tokenizer_dir: work/models/extended_tokenizer
  attn_implementation: null   # 或 "flash_attention_2"

data:
  train_file: work/data/sft_train.jsonl
  eval_file: work/data/sft_eval.jsonl
  max_length: 2048

qlora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bits: 4
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

training:
  output_dir: work/models/sft-qlora-qwen7b
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  eval_strategy: steps
  save_total_limit: 3
  gradient_checkpointing: true
  fp16: false
  bf16: true
  deepspeed: configs/train/ds_zero2.json
  report_to: none            # 或 wandb

merge:
  save_merged: true
  merged_dir: work/models/sft-merged-qwen7b
